<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>edX Platform - Lab 3</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <header class="mb-4">
        <h1 class="display-5">Course Management System (MVC)</h1>
        <p class="text-muted">Based on Lab 1 Subject Area & Lab 2 Backend</p>
    </header>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">Add New Course</div>
        <div class="card-body">
            <form action="/add" method="POST" class="row g-3">
                <div class="col-md-3">
                    <input type="text" name="course_id" class="form-control" placeholder="ID (e.g. CRS-101)" required>
                </div>
                <div class="col-md-4">
                    <input type="text" name="title" class="form-control" placeholder="Course Title" required>
                </div>
                <div class="col-md-3">
                    <input type="number" step="0.01" name="price" class="form-control" placeholder="Price ($)" required>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-success w-100">Add</button>
                </div>
            </form>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle border">
            <thead class="table-light">
                <tr>
                    <th>Internal ID</th>
                    <th>Course Code</th>
                    <th>Title</th>
                    <th>Price</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for course in courses %}
                <tr>
                    <td>{{ course.id }}</td>
                    <td><span class="badge bg-secondary">{{ course.course_id }}</span></td>
                    <td>{{ course.title }}</td>
                    <td><strong>${{ "%.2f"|format(course.price) }}</strong></td>
                    <td>
                        <a href="/delete/{{ course.id }}" class="btn btn-outline-danger btn-sm">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
